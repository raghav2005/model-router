[project]
name = "model-routing-poc"
version = "0.4.0"
description = "Trained, explainable LLM router with Switchyard execution and evaluation harnesses"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
switchyard = ["nemo-switchyard[cli,server]>=0.1.0,<0.2.0"]
production = ["gunicorn>=23,<24"]

[project.scripts]
model-router = "model_router.cli:main"
model-router-api = "model_router.api:main"

[tool.setuptools.package-data]
model_router = [
  "catalog.json",
  "benchmark_cases.json",
  "artifacts/*.npz",
]

[tool.setuptools.packages.find]
include = ["model_router*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
