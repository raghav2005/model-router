# Legacy Switchyard 0.1 Python-server profile configuration.
#
# New deployments should prefer switchyard_routes.toml and the current Rust
# server. This file remains only for reproducibility of the tested 0.1 package.
endpoints:
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1

targets:
  capable:
    endpoint: openai
    model: gpt-5.6-sol
    format: openai

  balanced:
    endpoint: openai
    model: gpt-5.6-terra
    format: openai

  efficient:
    endpoint: openai
    model: gpt-5.6-luna
    format: openai

  classifier:
    endpoint: openai
    model: gpt-5.6-luna
    format: openai

profiles:
  # Content-aware profile for mixed chat and API traffic.
  smart-general:
    type: llm-routing
    profile_name: general
    strong: capable
    weak: efficient
    classifier: classifier
    fallback_target_on_evict: capable
    classifier_min_confidence: 0.6
    classifier_fail_open: true
    classifier_recent_turn_window: 4

  # Content-aware profile tuned for coding-agent requests.
  smart-coding:
    type: llm-routing
    profile_name: coding_agent
    strong: capable
    weak: efficient
    classifier: classifier
    fallback_target_on_evict: capable
    classifier_min_confidence: 0.6
    classifier_fail_open: true
    classifier_recent_turn_window: 4

  # Reproducible traffic split for measuring the gateway and model pair.
  benchmark-random:
    type: random-routing
    strong: capable
    weak: efficient
    strong_probability: 0.5
    rng_seed: 42
